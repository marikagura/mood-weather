<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mood Climate A — 琉璃 · 雹雷晴虹</title>
<!--
  ═══════════════════════════════════════════════════════════════
  情绪气象 · 变体 A「琉璃」 v3
  照片背景 + liquid glass，四种天气：冰雹 / 雷暴 / 放晴 / 彩虹

  v3 = v2 自然化 + 动态化：
  · 视差三输入：手机陀螺仪（iOS 点 MOTION 授权）/ 鼠标 / 无输入时光自漂移
    —— 光晕、光柱、光斑、彩虹、云、粒子、玻璃卡片全部分层视差
  · 彩虹按真实显影过程出现：阳光穿透雨幕 → 虹脚先亮 → 整弧显影 → 轻微 shimmer
    （参考 RMetS / NWS 对彩虹形成条件与亮度分布的描述）
  · 冰雹：清冰壳+乳白核 sprite（NOAA/EPOD 洋葱层结构的视觉简化）
    砸在玻璃上磕弹留白印（不滑开，区别于雨滴）、落地碎冰、化水渍、冒白汽
  · 雷暴：云内闪为主 + 对地分形闪 + 雷击阵风
  · 棱镜面板：可旋转三棱镜白光色散（Snell 折射 + 波长相关折射率，
    参考 explerify / physandbox / kamilprusko-prism 一类光学模拟器的做法）
  · 冰雹 / 彩虹各两种风格可切（卡片 STYLE 行）

  情绪 → 天气映射在 WEATHERS 表；接情绪引擎时调 setWeather(key)
  ═══════════════════════════════════════════════════════════════
-->
<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.18);
        --text-dim: rgba(255, 255, 255, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #0a0e14;
        font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Segoe UI', system-ui, sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        touch-action: manipulation;   /* 防 iOS 连点双击缩放 */
    }

    #bg {
        position: fixed; inset: -34px;
        background-size: cover; background-position: center;
        filter: brightness(1) saturate(1);
        transition: filter 2.8s ease;
        z-index: 0;
        will-change: transform;
    }
    /* 天气色罩双层 crossfade（gradient 无法 CSS 过渡，只动 opacity） */
    .tint {
        position: fixed; inset: 0; z-index: 1;
        opacity: 0; transition: opacity 2.8s ease;
        pointer-events: none;
    }

    #sun {
        position: fixed; z-index: 2;
        top: -20vmin; right: -12vmin;
        width: 76vmin; height: 76vmin;
        background: radial-gradient(circle,
            rgba(255,247,222,0.95) 0%,
            rgba(255,231,178,0.5) 20%,
            rgba(255,214,140,0.18) 44%,
            transparent 66%);
        opacity: 0; transition: opacity 3s ease;
        pointer-events: none;
        mix-blend-mode: screen;
        will-change: transform;
    }
    .ray {
        position: fixed; z-index: 2;
        top: -22vh; right: 6vw;
        width: 17vw; height: 155vh;
        background: linear-gradient(180deg, rgba(255,241,206,0.16), transparent 72%);
        transform-origin: top center;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        transition: opacity 3s ease;
        will-change: transform;
    }

    canvas.layer { position: fixed; inset: 0; pointer-events: none; }
    #canvas-cloud   { z-index: 3; }
    #canvas-rainbow { z-index: 4; }
    #canvas-flare   { z-index: 5; }
    #canvas-fx      { z-index: 7; }
    #canvas-bolt    { z-index: 8; }

    #flash {
        position: fixed; inset: 0; z-index: 9;
        background: rgba(237, 240, 255, 1);
        opacity: 0; pointer-events: none;
    }
    .vignette {
        position: fixed; inset: 0; z-index: 10;
        background: radial-gradient(circle at 50% 40%, transparent 44%, rgba(0,0,0,0.4) 100%);
        pointer-events: none;
    }
    /* film grain：把照片、canvas、玻璃焊进同一张画面（steps 抖动，不静止） */
    .grain {
        position: fixed; inset: -30px; z-index: 10;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>");
        opacity: 0.05;
        pointer-events: none;
        animation: grainshift 0.85s steps(1) infinite;
    }
    @keyframes grainshift {
        0%   { background-position: 0 0; }
        12%  { background-position: -14px 9px; }
        25%  { background-position: 8px -16px; }
        37%  { background-position: -6px 4px; }
        50%  { background-position: 12px 13px; }
        62%  { background-position: -18px -7px; }
        75%  { background-position: 4px 17px; }
        87%  { background-position: -9px -12px; }
    }

    .stage {
        position: relative; z-index: 11;
        height: 100vh; height: 100dvh;
        display: flex; flex-direction: column;
        justify-content: center; align-items: flex-start;
        padding: 0 9%;
        pointer-events: none;
        perspective: 900px;
    }
    .stage > * { pointer-events: auto; }
    .brand { margin-bottom: 32px; pointer-events: none; user-select: none; }
    .brand span {
        font-size: 10px; letter-spacing: 5px; font-weight: 700;
        color: rgba(255,255,255,0.65);
        text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }
    .brand h1 {
        font-size: clamp(38px, 5.6vw, 74px);
        font-weight: 200; line-height: 1.04; margin-top: 10px;
        letter-spacing: 1px;
        text-shadow: 0 2px 24px rgba(0,0,0,0.35);
    }

    .main-card {
        width: min(430px, 100%);
        border-radius: 26px;
        background: var(--glass-bg);
        backdrop-filter: blur(26px) saturate(160%);
        -webkit-backdrop-filter: blur(26px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, calc(0.18 + var(--flash, 0) * 0.55));
        box-shadow: 0 30px 70px rgba(0,0,0,0.4),
                    inset 0 1px 0 rgba(255,255,255,calc(0.14 + var(--flash, 0) * 0.5)),
                    0 0 0 0 rgba(237,240,255,0);
        padding: 28px 30px 24px;
        position: relative; overflow: hidden;
        will-change: transform;
        /* transform 不走 CSS transition：视差已逐帧插值，雷击震动需要突变 */
    }
    .main-card::before {
        content: '';
        position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,calc(0.55 + var(--flash, 0) * 0.45)), transparent);
    }
    /* 卡片内特效夹层：落雨的折射水珠与积水画在玻璃与内容之间 */
    .card-fx {
        position: absolute; inset: 0;
        pointer-events: none;
        z-index: 0;
    }
    .main-card > *:not(.card-fx) { position: relative; z-index: 1; }
    .mood-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    #mood-emoji {
        font-size: 40px; line-height: 1;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mood-text h2 { font-size: 20px; font-weight: 500; letter-spacing: 0.5px; }
    .mood-text small {
        display: block; margin-top: 3px;
        font-size: 10px; letter-spacing: 2.5px; font-weight: 700;
        color: var(--text-dim);
    }
    #w-desc {
        font-size: 13.5px; line-height: 1.75; font-weight: 300;
        color: rgba(255,255,255,0.78);
        min-height: 3.4em;
    }
    .meta-row {
        display: flex; gap: 22px; margin-top: 16px; padding-top: 15px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }
    .meta-item small {
        display: block; font-size: 9px; letter-spacing: 2px;
        color: var(--text-dim); font-weight: 700; margin-bottom: 4px;
    }
    .meta-item span { font-size: 14px; font-weight: 300; font-variant-numeric: tabular-nums; }

    .style-row {
        display: none; align-items: center; gap: 8px;
        margin-top: 14px;
    }
    .style-row.on { display: flex; }
    .style-row small {
        font-size: 9px; letter-spacing: 2px; font-weight: 700;
        color: var(--text-dim);
    }
    .style-chip {
        appearance: none; border: none; cursor: pointer;
        padding: 5px 13px; border-radius: 999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        color: rgba(255,255,255,0.6);
        font-family: inherit; font-size: 11px; letter-spacing: 1px;
        transition: background 0.3s, color 0.3s;
    }
    .style-chip.active {
        background: rgba(255,255,255,0.22);
        color: #fff;
    }

    .mood-dock {
        position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex; gap: 5px;
        padding: 7px;
        border-radius: 999px;
        background: rgba(12, 16, 24, 0.44);
        backdrop-filter: blur(22px) saturate(150%);
        -webkit-backdrop-filter: blur(22px) saturate(150%);
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 18px 46px rgba(0,0,0,0.42);
    }
    .mood-btn {
        appearance: none; border: none; cursor: pointer;
        display: flex; align-items: center; gap: 8px;
        padding: 10px 17px;
        border-radius: 999px;
        background: transparent;
        color: rgba(255,255,255,0.62);
        font-family: inherit; font-size: 12.5px; font-weight: 500;
        letter-spacing: 1px;
        transition: background 0.35s ease, color 0.35s ease, transform 0.15s ease;
        white-space: nowrap;
    }
    .mood-btn .e { font-size: 17px; }
    .mood-btn:hover { color: #fff; }
    .mood-btn:active { transform: scale(0.94); }
    .mood-btn.active {
        background: rgba(255,255,255,0.17);
        color: #fff;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 4px 14px rgba(0,0,0,0.26);
    }

    .top-bar {
        position: fixed; top: max(20px, env(safe-area-inset-top)); right: 24px;
        z-index: 20;
        display: flex; align-items: center; gap: 10px;
        flex-wrap: wrap; justify-content: flex-end;
    }
    .pill {
        display: flex; align-items: center; gap: 11px;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(12, 16, 24, 0.42);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.13);
    }
    .pill label {
        font-size: 9px; letter-spacing: 2px; font-weight: 700;
        color: var(--text-dim);
    }
    #slider { width: 104px; accent-color: #fff; cursor: pointer; }
    .txt-btn {
        cursor: pointer;
        font-size: 10px; letter-spacing: 1.5px; font-weight: 700;
        color: rgba(255,255,255,0.75);
        transition: color 0.3s;
        user-select: none;
        background: none; border: none; font-family: inherit;
    }
    .txt-btn:hover { color: #fff; }
    #bg-file { display: none; }
    #motion-btn { display: none; }

    /* ── 棱镜放大镜：拖着一块玻璃看场景 ── */
    #lens-canvas {
        position: fixed; z-index: 30;
        display: none;
        border-radius: 50%;
        cursor: grab;
        touch-action: none;
        box-shadow: 0 24px 60px rgba(0,0,0,0.5),
                    0 0 0 1px rgba(255,255,255,0.12),
                    inset 0 0 30px rgba(255,255,255,0.06);
    }
    #lens-canvas:active { cursor: grabbing; }
    .lens-hint {
        position: fixed; z-index: 30;
        left: 50%; transform: translateX(-50%);
        bottom: calc(max(24px, env(safe-area-inset-bottom)) + 76px);
        font-size: 10.5px; letter-spacing: 2px;
        color: rgba(255,255,255,0.55);
        background: rgba(12,16,24,0.4);
        padding: 6px 14px; border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        pointer-events: none;
    }

    @media (max-width: 760px) {
        .stage { padding: 0 22px; justify-content: flex-end; padding-bottom: 122px; }
        .brand { margin-bottom: 20px; }
        .brand h1 { font-size: 40px; }
        .mood-btn { padding: 9px 13px; font-size: 0; gap: 0; }
        .mood-btn .e { font-size: 20px; }
        .top-bar { right: 14px; left: 14px; }
        #slider { width: 74px; }
    }
</style>
</head>
<body>

<div id="bg"></div>
<div class="tint" id="tint-a"></div>
<div class="tint" id="tint-b"></div>
<div id="sun"></div>
<div class="ray" id="ray-a"></div>
<div class="ray" id="ray-b"></div>

<canvas class="layer" id="canvas-cloud"></canvas>
<canvas class="layer" id="canvas-rainbow"></canvas>
<canvas class="layer" id="canvas-flare"></canvas>
<canvas class="layer" id="canvas-fx"></canvas>
<canvas class="layer" id="canvas-bolt"></canvas>
<div id="flash"></div>
<div class="grain"></div>
<div class="vignette"></div>

<main class="stage">
    <header class="brand">
        <span>MOOD CLIMATE · A</span>
        <h1>Inner<br>Weather.</h1>
    </header>
    <section class="main-card" id="card">
        <canvas class="card-fx" id="card-canvas"></canvas>
        <div class="mood-row">
            <div id="mood-emoji">☀️</div>
            <div class="mood-text">
                <h2 id="w-name">放晴 / CLEAR</h2>
                <small id="w-mood">MOOD · CALM</small>
            </div>
        </div>
        <p id="w-desc">正在加载环境模拟……</p>
        <div class="meta-row">
            <div class="meta-item"><small>PARTICLES</small><span id="m-count">0</span></div>
            <div class="meta-item"><small>INTENSITY</small><span id="m-int">65%</span></div>
            <div class="meta-item"><small>STATE</small><span id="m-state">STABLE</span></div>
        </div>
        <div class="style-row" id="style-row">
            <small>STYLE</small>
            <span id="style-chips"></span>
        </div>
    </section>
</main>

<nav class="mood-dock" id="dock">
    <button class="mood-btn" data-w="clear"><span class="e">☀️</span>平静 · 放晴</button>
    <button class="mood-btn" data-w="rainbow"><span class="e">🌈</span>开心 · 彩虹</button>
    <button class="mood-btn" data-w="rain"><span class="e">🌧️</span>难过 · 落雨</button>
    <button class="mood-btn" data-w="snow"><span class="e">❄️</span>安静 · 落雪</button>
    <button class="mood-btn" data-w="hail"><span class="e">🧊</span>烦躁 · 冰雹</button>
    <button class="mood-btn" data-w="storm"><span class="e">⛈️</span>生气 · 雷暴</button>
</nav>

<div class="top-bar">
    <div class="pill">
        <label>INTENSITY</label>
        <input type="range" id="slider" min="10" max="100" value="65">
    </div>
    <button class="pill txt-btn" id="prism-btn">◮ PRISM</button>
    <button class="pill txt-btn" id="motion-btn">◎ MOTION</button>
    <label class="pill txt-btn" for="bg-file" title="单击换内置背景 · 双击上传自己的照片">ENVIRONMENT ⟳</label>
    <input type="file" id="bg-file" accept="image/*">
</div>

<canvas id="lens-canvas"></canvas>
<div class="lens-hint" id="lens-hint">拖动棱镜 · 透过它看彩虹</div>

<script>
'use strict';

/* ════════════════════════════════════════════
   0. 天气 Profile
   ════════════════════════════════════════════ */
const WEATHERS = {
    clear: {
        name: '放晴 / CLEAR', mood: 'MOOD · CALM', emoji: '☀️', state: 'STABLE',
        desc: '心情平静。云在退场，光斑一粒一粒落回地面，系统各项指标恢复安稳。',
        bgFilter: 'brightness(1.06) saturate(1.12)',
        tint: { bg: 'linear-gradient(180deg, rgba(255,214,140,0.14), rgba(255,178,102,0.08))', op: 1 },
        cloud: { count: 3, alpha: 0.14, dark: 0 },
        sun: 1, ray: 0.5, rainbow: 0, flare: 1,
        hail: 0, rain: 0, bolt: 0, dust: 1
    },
    rainbow: {
        name: '彩虹 / RAINBOW', mood: 'MOOD · JOY', emoji: '🌈', state: 'SPECTRUM',
        desc: '心情很好。雨刚停，水汽还悬在半空，光走进去排成了七色的队。',
        bgFilter: 'brightness(1.03) saturate(1.18)',
        tint: { bg: 'linear-gradient(180deg, rgba(160,200,255,0.1), rgba(255,214,160,0.1))', op: 1 },
        cloud: { count: 5, alpha: 0.18, dark: 0 },
        sun: 0.75, ray: 0.32, rainbow: 1, flare: 0.5,
        hail: 0, rain: 0.16, bolt: 0, dust: 0.7,
        /* 三种真实存在的虹：经典双虹 / fogbow 白雾虹 / 日落红虹 */
        styles: { neon: '霓光', fog: '雾虹', dusk: '暮虹' }
    },
    hail: {
        name: '冰雹 / HAIL', mood: 'MOOD · IRRITATED', emoji: '🧊', state: 'IMPACT',
        desc: '有点烦躁。对流太强的夏天下午，砸下来的都是没说出口的话，磕在玻璃上弹开，不肯化。',
        bgFilter: 'brightness(0.62) saturate(0.55) contrast(1.05)',
        tint: { bg: 'linear-gradient(180deg, rgba(120,140,165,0.22), rgba(40,52,68,0.3))', op: 1 },
        cloud: { count: 7, alpha: 0.3, dark: 0.4 },
        sun: 0, ray: 0, rainbow: 0, flare: 0,
        hail: 1, rain: 0.14, bolt: 0, dust: 0,
        styles: { crystal: '琉璃珠', shatter: '碎冰暴' }
    },
    storm: {
        name: '雷暴 / STORM', mood: 'MOOD · ANGRY', emoji: '⛈️', state: 'DISCHARGE',
        desc: '情绪激烈。云层正在放电，每一道闪光都是一次没压住的脾气，请勿靠近核心区。',
        bgFilter: 'brightness(0.4) saturate(0.5) contrast(1.12) hue-rotate(-8deg)',
        tint: { bg: 'linear-gradient(180deg, rgba(60,50,110,0.34), rgba(8,6,16,0.5))', op: 1 },
        cloud: { count: 8, alpha: 0.4, dark: 0.6 },
        sun: 0, ray: 0, rainbow: 0, flare: 0,
        hail: 0, rain: 1.4, bolt: 1, dust: 0, glassdrops: 0.8
    },
    /* 朋友原作《落雨与积水》《落雪与积雪》的两个天气，接进同一引擎 */
    rain: {
        name: '落雨 / RAIN', mood: 'MOOD · MELANCHOLY', emoji: '🌧️', state: 'STEADY',
        desc: '有点难过。雨不大也不小，就是不停，玻璃上的水珠一颗一颗排着队往下走。',
        bgFilter: 'brightness(0.72) saturate(0.7)',
        tint: { bg: 'linear-gradient(180deg, rgba(90,115,150,0.2), rgba(40,55,75,0.26))', op: 1 },
        cloud: { count: 6, alpha: 0.26, dark: 0.26 },
        sun: 0, ray: 0, rainbow: 0, flare: 0,
        hail: 0, rain: 0.95, bolt: 0, dust: 0, glassdrops: 1
    },
    snow: {
        name: '落雪 / SNOW', mood: 'MOOD · SERENE', emoji: '❄️', state: 'DRIFT',
        desc: '心很静。雪没有声音，一层一层把边角都盖圆了，世界的音量被调到了最低。',
        bgFilter: 'brightness(0.9) saturate(0.5) contrast(0.94)',
        tint: { bg: 'linear-gradient(180deg, rgba(190,205,225,0.18), rgba(140,155,180,0.2))', op: 1 },
        cloud: { count: 6, alpha: 0.32, dark: 0.06 },
        sun: 0, ray: 0, rainbow: 0, flare: 0,
        hail: 0, rain: 0, bolt: 0, dust: 0, snow: 1
    }
};
const styleSel = { hail: 'crystal', rainbow: 'neon' };

const ENVIRONMENTS = [
    'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&q=80&w=2070',
    'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&q=80&w=2070',
    'https://images.unsplash.com/photo-1439066615861-d1af74d74000?auto=format&fit=crop&q=80&w=2070',
    'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&q=80&w=2070'
];
let envIdx = 0;

/* ════════════════════════════════════════════
   1. 全局状态 + 视差（陀螺仪 / 鼠标 / idle 光漂移）
   ════════════════════════════════════════════ */
let current = 'clear';
let intensity = 65;
const W = {};
Object.keys(WEATHERS).forEach(k => W[k] = 0);
W.clear = 1;

let vw = innerWidth, vh = innerHeight;
let lastT = performance.now();

const wind = { x: 1.1, t: Math.random() * 100, gust: 0 };
function stepWind(dt) {
    wind.t += dt * 0.00022;
    wind.gust *= Math.pow(0.995, dt / 16);
    wind.x = 1.05 + Math.sin(wind.t) * 0.75 + Math.sin(wind.t * 2.63) * 0.4 + wind.gust;
}

/* 视差核心：par.x / par.y ∈ [-1,1]，三种来源，平滑趋近 */
const par = { x: 0, y: 0, tx: 0, ty: 0, lastInput: 0, idleT: Math.random() * 50 };
function feedParallax(nx, ny) {
    par.tx = Math.max(-1, Math.min(1, nx));
    par.ty = Math.max(-1, Math.min(1, ny));
    par.lastInput = performance.now();
}
addEventListener('mousemove', e => {
    feedParallax((e.clientX / vw - 0.5) * 2, (e.clientY / vh - 0.5) * 2);
});
/* 触屏：在背景上拖动 = 移动视角（没有陀螺仪也能「摇」） */
addEventListener('touchmove', e => {
    const t = e.target;
    if (t.closest && t.closest('.mood-dock, .top-bar, .main-card, #lens-canvas')) return;
    const tp = e.touches[0];
    feedParallax((tp.clientX / vw - 0.5) * 2.4, (tp.clientY / vh - 0.5) * 2.4);
}, { passive: true });
addEventListener('deviceorientation', e => {
    if (e.gamma == null || e.beta == null) return;
    /* 手机左右倾 gamma ±30° 铺满，前后倾 beta 以 40° 为中心 */
    feedParallax(e.gamma / 30, (e.beta - 40) / 30);
});
/* iOS 13+ 需要用户手势授权陀螺仪 */
if (typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function') {
    const mb = document.getElementById('motion-btn');
    mb.style.display = 'block';
    mb.addEventListener('click', () => {
        DeviceOrientationEvent.requestPermission().then(r => {
            if (r === 'granted') mb.style.display = 'none';
        }).catch(() => {});
    });
}
function stepParallax(dt, now) {
    /* 8 秒没有输入 → 光自己慢慢走（idle 漂移） */
    if (now - par.lastInput > 8000) {
        par.idleT += dt * 0.00013;
        par.tx = Math.sin(par.idleT) * 0.55;
        par.ty = Math.cos(par.idleT * 0.71) * 0.35;
    }
    par.x += (par.tx - par.x) * 0.045 * (dt / 16);
    par.y += (par.ty - par.y) * 0.045 * (dt / 16);
}

const $ = id => document.getElementById(id);
const cvs = {
    cloud: $('canvas-cloud'), rainbow: $('canvas-rainbow'),
    flare: $('canvas-flare'), fx: $('canvas-fx'), bolt: $('canvas-bolt')
};
const ctx = {};
for (const k in cvs) ctx[k] = cvs[k].getContext('2d');

function resize() {
    vw = innerWidth; vh = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    for (const k in cvs) {
        cvs[k].width = Math.round(vw * dpr);
        cvs[k].height = Math.round(vh * dpr);
        cvs[k].style.width = vw + 'px';
        cvs[k].style.height = vh + 'px';
        ctx[k].setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    updateCardRect();
    rbCache = null;
    gradeDirty = true;
}
addEventListener('resize', resize);

let cardRect = { left: 0, top: 0, right: 0, bottom: 0, width: 0, height: 0 };
function updateCardRect() {
    const r = $('card').getBoundingClientRect();
    cardRect = { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
    /* 卡片内特效夹层跟着卡片尺寸走 */
    const cc = $('card-canvas');
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    if (cc.width !== Math.round(w * dpr)) {
        cc.width = Math.round(w * dpr);
        cc.height = Math.round(h * dpr);
        cc.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    if (typeof resizeSnowField === 'function') resizeSnowField();
}
function weightOf(prop) {
    let v = 0;
    for (const k in W) v += (WEATHERS[k][prop] || 0) * W[k];
    return v;
}

/* DOM 层视差应用（每帧一次，transform 便宜） */
let cardShake = 0;      /* 雷击震窗幅度，逐帧衰减 */
let flashNow = 0;       /* 当前白闪不透明度（每帧读一次，珠子/镜面跟着亮） */
let cardFlashSet = false;
function applyDomParallax() {
    $('bg').style.transform = `translate(${par.x * -14}px, ${par.y * -9}px)`;
    $('sun').style.transform = `translate(${par.x * 34}px, ${par.y * 22}px)`;
    $('ray-a').style.transform = `rotate(${22 + par.x * 2.4}deg)`;
    $('ray-b').style.transform = `rotate(${16 + par.x * 1.7}deg)`;
    /* 玻璃卡片轻微 3D 倾斜 + 雷击时的震动 */
    let shake = '';
    if (cardShake > 0.1) {
        shake = ` translate(${(Math.random() - 0.5) * cardShake}px, ${(Math.random() - 0.5) * cardShake * 0.6}px)`;
        cardShake *= 0.86;
    }
    $('card').style.transform =
        `perspective(900px) rotateY(${par.x * 2.6}deg) rotateX(${par.y * -1.8}deg)` + shake;
}

/* ════════════════════════════════════════════
   2. 云
   ════════════════════════════════════════════ */
function makeCloudSprite() {
    const c = document.createElement('canvas');
    c.width = 480; c.height = 240;
    const g = c.getContext('2d');
    for (let i = 0; i < 9; i++) {
        const x = 70 + Math.random() * 340, y = 90 + Math.random() * 70;
        const r = 45 + Math.random() * 65;
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.5)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    return c;
}
const cloudSprites = [makeCloudSprite(), makeCloudSprite(), makeCloudSprite()];

/* ── 谷间雾层：两层软雾横向漂移（近快远慢），湿天气才现身 ── */
function makeFogSprite() {
    const c = document.createElement('canvas');
    c.width = 900; c.height = 260;
    const g = c.getContext('2d');
    for (let i = 0; i < 7; i++) {
        const x = 80 + Math.random() * 740, y = 70 + Math.random() * 120;
        const r = 90 + Math.random() * 130;
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(235,240,248,0.34)');
        grad.addColorStop(1, 'rgba(235,240,248,0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    return c;
}
const fogSprites = [makeFogSprite(), makeFogSprite()];
const fogLayers = [
    { x: 0, v: 0.14, yr: 0.52, scale: 1.5, sp: 0 },   /* 近层：低、快 */
    { x: 0, v: 0.05, yr: 0.34, scale: 2.1, sp: 1 }    /* 远层：高、慢 */
];
/* 各天气的雾量 */
const FOG_W = { clear: 0, rainbow: 0.16, rain: 0.5, snow: 0.34, hail: 0.28, storm: 0.34 };
function drawFog(g, dt) {
    let fog = 0;
    for (const k in W) fog += (FOG_W[k] || 0) * W[k];
    if (fog < 0.01) return;
    fogLayers.forEach(L => {
        L.x = (L.x + L.v * (dt / 16)) % 900;
        const sw = 900 * L.scale, sh = 260 * L.scale;
        const y = vh * L.yr + par.y * -8 * (L.sp ? 0.5 : 1);
        g.save();
        g.globalAlpha = fog * (L.sp ? 0.55 : 0.8);
        /* 两张接龙，横向无缝循环 */
        const ox = -L.x * L.scale + par.x * -10 * (L.sp ? 0.5 : 1);
        g.drawImage(fogSprites[L.sp], ox, y, sw, sh);
        g.drawImage(fogSprites[L.sp], ox + sw, y, sw, sh);
        if (ox + sw * 2 < vw) g.drawImage(fogSprites[L.sp], ox + sw * 2, y, sw, sh);
        g.restore();
    });
}
class Cloud {
    constructor(i) {
        this.sprite = cloudSprites[i % 3];
        this.depth = 0.4 + Math.random() * 0.6;   /* 视差深度 */
        this.reset(true);
    }
    reset(init) {
        this.scale = 1.2 + Math.random() * 2.4;
        this.x = init ? Math.random() * vw - 240 : -480 * this.scale;
        this.y = -60 + Math.random() * vh * 0.4;
        this.v = 0.1 + Math.random() * 0.28;
        this.o = 0.5 + Math.random() * 0.5;
    }
    step(dt) {
        this.x += (this.v + wind.x * 0.06) * (dt / 16);
        if (this.x > vw + 60) this.reset(false);
    }
}
const clouds = Array.from({ length: 8 }, (_, i) => new Cloud(i));

function drawClouds(dt) {
    const g = ctx.cloud;
    g.clearRect(0, 0, vw, vh);
    let alpha = 0, dark = 0, count = 0;
    for (const k in W) {
        const p = WEATHERS[k].cloud, w = W[k];
        alpha += p.alpha * w; dark += p.dark * w; count += p.count * w;
    }
    if (alpha < 0.01) return;
    /* 彩虹进行时：云随雨停逐渐散掉（走向放晴） */
    const cloudFade = 1 - Math.min(rbAge / 32, 0.5) * W.rainbow;
    const effCount = count * cloudFade;
    clouds.forEach((c, i) => {
        /* 边界那朵云按小数部分渐隐，不整朵 pop 掉 */
        const edgeA = Math.max(0, Math.min(1, effCount - i));
        if (edgeA <= 0.003) return;
        g.globalAlpha = alpha * cloudFade * c.o * edgeA;
        g.drawImage(c.sprite,
            c.x + par.x * -18 * c.depth, c.y + par.y * -10 * c.depth,
            480 * c.scale, 240 * c.scale);
    });
    g.globalAlpha = 1;
    if (dark > 0.02) {
        g.save();
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = `rgba(24, 26, 40, ${dark})`;
        g.fillRect(0, 0, vw, vh);
        g.restore();
    }
    drawFog(g, dt || 16);
}

/* ════════════════════════════════════════════
   3. 彩虹 v3 —— 连续光谱（内亮 · Alexander 暗带 ·
      supernumerary · 副虹）+ 真实显影：虹脚先亮 → 整弧
      + shimmer + 视角（视差）位移
   ════════════════════════════════════════════ */
let rbGrow = 0, rbShimT = 0;
let rbAge = 0;            /* 彩虹态的年龄（秒）：驱动 雨停 → 云散 → 虹峰值 → 缓慢淡去 */
let rbRainStopped = false;
let rbCache = null;
let rbSeed = null;        /* 雨幕分布（亮脚方向/分段明暗/疏密团）：进彩虹时掷一次，resize 重建沿用 */
const easeOut = t => 1 - Math.pow(1 - t, 3);

function buildRainbowSprite() {
    const S = 4;      /* 低清渲染放大 = 色带边界自带弥散（照片里的虹没有锐边） */
    /* 出血 80px：视差移动贴图时不露边（否则出现垂直截断线） */
    const BLEED = 80;
    const w = Math.ceil((vw + BLEED * 2) / S), h = Math.ceil((vh + BLEED * 2) / S);
    const portrait = vh > vw;
    const apexY = vh * (portrait ? 0.3 : 0.2);
    const CX = vw * 0.55 + BLEED, CY = vh * 1.25 + BLEED;
    const R = (CY - (apexY + BLEED)) / S;
    const cx = CX / S, cy = CY / S;
    const A = 1;          /* 浓淡交给各风格的 stop 值与 INTENSITY */
    const WD = 1;

    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    const kind = styleSel.rainbow;

    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, R);
    const stop = (t, r, gr, b, a) => grad.addColorStop(Math.max(0, Math.min(1, t)), `rgba(${r},${gr},${b},${a * A})`);
    stop(0.0, 255, 255, 255, 0);
    stop(0.62, 255, 255, 255, 0.03);
    stop(0.80, 255, 253, 248, 0.1);
    stop(0.868, 255, 252, 244, 0.14);
    if (kind === 'neon') {
        /* supernumerary 干涉纹（两圈渐密） */
        stop(0.874, 200, 160, 255, 0.15);
        stop(0.880, 160, 230, 170, 0.12);
        stop(0.886, 255, 255, 255, 0.06);
        const b0 = 0.892, span = (0.985 - 0.892) * WD;
        const at = t => b0 + span * t;
        stop(at(0.00), 150, 95, 245, 0.15);
        stop(at(0.16), 88, 128, 255, 0.19);
        stop(at(0.32), 70, 195, 220, 0.2);
        stop(at(0.48), 108, 222, 96, 0.21);
        stop(at(0.66), 252, 228, 72, 0.24);
        stop(at(0.82), 255, 158, 52, 0.24);
        stop(at(0.95), 255, 74, 58, 0.21);
        stop(Math.min(1, at(1.0) + 0.005), 255, 60, 60, 0);
    } else if (kind === 'fog') {
        /* fogbow：水滴太小、衍射抹掉色彩——宽白带 + 极淡蓝内缘红外缘 */
        stop(0.858, 150, 180, 255, 0.14);
        stop(0.878, 235, 240, 250, 0.36);
        stop(0.92, 255, 255, 255, 0.52);
        stop(0.962, 255, 235, 225, 0.34);
        stop(0.985, 255, 160, 140, 0.12);
        stop(1, 255, 140, 120, 0);
    } else {
        /* 暮虹：日落时蓝绿被大气散射滤掉，只剩红橙金 */
        const b0 = 0.885, span = (0.985 - 0.885) * 1.1;
        const at = t => b0 + span * t;
        stop(at(0.0), 200, 90, 60, 0.06);
        stop(at(0.25), 255, 130, 60, 0.17);
        stop(at(0.55), 255, 170, 70, 0.22);
        stop(at(0.8), 255, 110, 60, 0.23);
        stop(at(0.98), 250, 70, 50, 0.17);
        stop(1, 250, 60, 50, 0);
    }
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);

    if (kind !== 'fog') {
        /* Alexander 暗带（fogbow 没有清晰暗带） */
        const dark = g.createRadialGradient(cx, cy, R, cx, cy, R * 1.13);
        dark.addColorStop(0, 'rgba(20,26,44,0)');
        dark.addColorStop(0.3, `rgba(20,26,44,${0.1 * A})`);
        dark.addColorStop(0.75, `rgba(20,26,44,${0.09 * A})`);
        dark.addColorStop(1, 'rgba(20,26,44,0)');
        g.fillStyle = dark;
        g.fillRect(0, 0, w, h);

        /* 副虹（色序反转、约主虹三至五成亮度） */
        const R2 = R * 1.19;
        const grad2 = g.createRadialGradient(cx, cy, 0, cx, cy, R2);
        const s2 = (t, r, gr, b, a) => grad2.addColorStop(Math.max(0, Math.min(1, t)), `rgba(${r},${gr},${b},${a * A})`);
        if (kind === 'neon') {
            s2(0.90, 255, 60, 60, 0);
            s2(0.912, 255, 84, 62, 0.12);
            s2(0.928, 255, 170, 60, 0.13);
            s2(0.944, 245, 225, 80, 0.13);
            s2(0.958, 110, 218, 100, 0.12);
            s2(0.972, 80, 150, 250, 0.12);
            s2(0.986, 155, 100, 245, 0.1);
            s2(1.0, 160, 95, 245, 0);
        } else {
            s2(0.9, 250, 90, 60, 0);
            s2(0.94, 255, 140, 80, 0.1);
            s2(0.98, 250, 100, 60, 0.07);
            s2(1.0, 250, 80, 50, 0);
        }
        g.globalCompositeOperation = 'lighter';
        g.fillStyle = grad2;
        g.fillRect(0, 0, w, h);
    }

    /* 顶部薄、底部收进地景 */
    g.globalCompositeOperation = 'destination-out';
    const topFade = g.createLinearGradient(0, 0, 0, h);
    topFade.addColorStop(0, 'rgba(0,0,0,0.4)');
    topFade.addColorStop(0.35, 'rgba(0,0,0,0)');
    topFade.addColorStop(0.78, 'rgba(0,0,0,0)');
    topFade.addColorStop(1, 'rgba(0,0,0,0.85)');
    g.fillStyle = topFade;
    g.fillRect(0, 0, w, h);

    /* ── 自然感核心：虹只在雨幕覆盖的角度段成形 ──
       沿弧角做明暗分段（conic 擦除）：一只脚亮而实、顶弧淡、另一脚若有若无。
       每次显影分布都随机——像真实雨幕边缘扫过。 */
    /* 分布进彩虹时掷一次存 rbSeed——转屏 resize 重建不换脸 */
    if (!rbSeed) {
        const seg = t => 0.15 + Math.random() * t;
        let wts0 = [0.3 + seg(0.25), 0.45 + seg(0.3), 0.35 + seg(0.3), 0.6 + seg(0.3), 0.85 + seg(0.15)];
        const br0 = Math.random() < 0.6;
        if (!br0) wts0 = wts0.reverse();
        rbSeed = {
            brightRight: br0,
            wts: wts0,
            blobs: Array.from({ length: 2 }, () => ({
                ex: 0.15 + Math.random() * 0.7,
                ey: 0.15 + Math.random() * 0.5,
                er: 0.12 + Math.random() * 0.16,
                ea: 0.1 + Math.random() * 0.12
            }))
        };
    }
    const brightRight = rbSeed.brightRight;
    const wts = rbSeed.wts;
    if (g.createConicGradient) {
        const conic = g.createConicGradient(0, cx, cy);
        /* 弧在 π..2π（上半圆）；conic t = angle/2π → 0.5..1 */
        conic.addColorStop(0.5, `rgba(0,0,0,${1 - wts[0]})`);
        conic.addColorStop(0.625, `rgba(0,0,0,${1 - wts[1]})`);
        conic.addColorStop(0.75, `rgba(0,0,0,${1 - wts[2]})`);
        conic.addColorStop(0.875, `rgba(0,0,0,${1 - wts[3]})`);
        conic.addColorStop(1, `rgba(0,0,0,${1 - wts[4]})`);
        g.fillStyle = conic;
        g.fillRect(0, 0, w, h);
    }
    /* 疏密补刀：两团轻擦（雨幕内部的密度起伏，参数来自 rbSeed） */
    rbSeed.blobs.forEach(bl => {
        const ex = w * bl.ex, ey = h * bl.ey, er = w * bl.er;
        const eg = g.createRadialGradient(ex, ey, 0, ex, ey, er);
        eg.addColorStop(0, `rgba(0,0,0,${bl.ea})`);
        eg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = eg;
        g.beginPath(); g.arc(ex, ey, er, 0, Math.PI * 2); g.fill();
    });

    /* 亮脚下的雨柱：虹站在雨幕上，脚亮的地方有一柱朦胧的白 */
    g.globalCompositeOperation = 'lighter';
    const footX = cx + (brightRight ? 1 : -1) * R * 0.72;
    const shaft = g.createLinearGradient(0, h * 0.2, 0, h);
    shaft.addColorStop(0, 'rgba(235,240,248,0)');
    shaft.addColorStop(0.55, 'rgba(235,240,248,0.045)');
    shaft.addColorStop(1, 'rgba(235,240,248,0.02)');
    g.fillStyle = shaft;
    const shaftW = w * 0.2;
    g.fillRect(footX - shaftW / 2, 0, shaftW, h);
    g.globalCompositeOperation = 'source-over';

    rbCache = { cv, apexY, bleed: BLEED, cxS: vw * 0.55, cyS: vh * 1.25, rS: vh * 1.25 - apexY };
}

function drawRainbow(dt) {
    const g = ctx.rainbow;
    g.clearRect(0, 0, vw, vh);
    const vis = weightOf('rainbow');
    /* 显影：真实彩虹是阳光穿透雨幕后「显」出来的，8 秒左右到全亮 */
    rbGrow += ((vis > 0.05 ? 1 : 0) - rbGrow) * 0.010 * (dt / 16);
    if (vis < 0.01 || rbGrow < 0.012) return;
    if (!rbCache) buildRainbowSprite();
    rbShimT += dt * 0.0005;
    const grow = easeOut(rbGrow);
    /* shimmer：像雨幕在风里晃，亮度轻微起伏 */
    const shim = 1 + Math.sin(rbShimT * 2.4) * 0.05 + Math.sin(rbShimT * 5.7) * 0.03;
    /* 真实彩虹只有 5-15 分钟：峰值之后随雨幕散去缓慢变淡（demo 里 40 秒后开始，最低留 55%） */
    const fade = rbAge < 40 ? 1 : Math.max(0.55, 1 - (rbAge - 40) * 0.012);
    /* 视角位移：彩虹跟着观察者，视差里它反向微移 + 微缩放 */
    const ox = par.x * -30, oy = par.y * -12;

    /* INTENSITY 滑杆 = 虹的深浅 */
    const depth = 0.3 + (intensity / 100) * 0.7;
    const a = Math.min(1, vis * grow * shim * fade * depth);
    const B = rbCache.bleed;
    g.save();
    /* 两遍混合：screen 出光感（主体），source-over 只兜一点点底（亮天空可见就够——多了就实心） */
    g.globalCompositeOperation = 'screen';
    g.globalAlpha = a;
    g.drawImage(rbCache.cv, ox - B, oy - B, vw + B * 2, vh + B * 2);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = a * 0.18;
