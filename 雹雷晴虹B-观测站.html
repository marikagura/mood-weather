<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mood Climate B — 观测站 · 雹雷晴虹</title>
<!--
  ═══════════════════════════════════════════════════════════════
  情绪气象 · 变体 B「观测站」 v3
  纯程序化场景：山谷 + 时辰随天气整体变换（无外部图片依赖）
  放晴=破晓金 / 彩虹=晨雨初霁 / 冰雹=铅灰白昼 / 雷暴=暗夜放电
  落雨=青灰湿谷 / 落雪=昏白雪谷（从 A 移植：卡片蠕滑水珠 / 三型雪花）

  v3 = 从 A「琉璃」移植的新引擎，适配山谷场景：
  · 全局风场 wind：所有下落物共享倾角、缓慢摆动，雷击带阵风
  · 视差三输入：陀螺仪（iOS 点 MOTION 授权）/ 鼠标 / 触屏拖动，
    8 秒无输入时光自漂移 —— 三层山 / 云 / 星空 / 粒子 / 卡片分层视差
  · 冰雹 v3：清冰壳+乳白核 sprite（NOAA/EPOD 洋葱层结构的视觉简化）、
    砸观测卡片按尺寸分档磕弹或炸裂、碎冰片 / 水渍 / 融化白汽；
    落点仍是最前层山脊 ridgeYAt(x)，山脊积雹白线保留
  · 彩虹 v3：连续光谱贴图（Alexander 暗带 + 副虹 + supernumerary）
    + 真实显影（阳光穿透雨幕慢慢显出来）+ shimmer + INTENSITY 调深浅，
    三风格：霓光 / 雾虹 / 月虹（月虹 = 夜空里的极淡银白虹，B 独有）
  · 彩虹时间演化：残雨 14 秒内停 → 云散 → 文案收尾
  · 落雨：观测卡片上的蠕滑水珠（paintDrop / GlassDrop 与 A 同一份：倒像切片 +
    珠内微亮 + 暗边环 + 底缘焦散亮弧 + 顶高光；生命周期 = 随机出现 → 长大 → 动量蠕滑 →
    拖尾子滴 / 吞并 → 汇入积水，雨停蒸发）+ 卡片底积水（波浪面 + 水体折射 + 弯月面亮线）。
    B 无照片，倒像与折射从 astro/cloud/scene/fx/bolt 五层 canvas 取样（drawSceneRegion）
  · 落雪：软片 sprite 三档景深（远 / 中 / 近，不画晶体、不旋转、不描边），
    摆动小而慢、横向速度 lerp 平滑；
    雪落最前层山脊与冰雹共用 ridgeField 积雪，也落观测卡片顶（snowField）
  六种天气 · 单文件 · canvas 2D 分层 · 情绪映射在 WEATHERS 表
  与《落雨与积水》《落雪与积雪》同架构，观测站 UI 对齐 Crystal Climate
  ═══════════════════════════════════════════════════════════════
-->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Noto+Sans+SC:wght@300;500&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        touch-action: manipulation;
        background: #05070c;
        font-family: 'Space Grotesk', 'Noto Sans SC', -apple-system, system-ui, sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
    }

    /* 天空双层 crossfade */
    .sky { position: fixed; inset: 0; z-index: 0; transition: opacity 2.6s ease; }
    #sky-b { opacity: 0; }

    canvas { position: fixed; inset: 0; pointer-events: none; }
    /* 棱镜放大镜（观测站的手持镜） */
    #lens-canvas {
        position: fixed; z-index: 30;
        display: none;
        border-radius: 50%;
        cursor: grab;
        touch-action: none;
        box-shadow: 0 24px 60px rgba(0,0,0,0.55),
                    0 0 0 1px rgba(255,255,255,0.16),
                    inset 0 0 30px rgba(255,255,255,0.05);
    }
    #lens-canvas:active { cursor: grabbing; }
    #prism-btn {
        position: fixed; top: max(24px, env(safe-area-inset-top)); right: 22px;
        z-index: 100;
        appearance: none; cursor: pointer;
        background: rgba(5, 8, 14, 0.6);
        border: 1px solid rgba(255,255,255,0.14);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: rgba(255,255,255,0.75);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 10px; letter-spacing: 2px; font-weight: 700;
        padding: 11px 16px;
        transition: color 0.3s, background 0.3s;
    }
    #prism-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    #canvas-astro   { z-index: 1; }   /* 星 / 卫星 / 晨光尘 */
    #canvas-cloud   { z-index: 2; }
    #canvas-rainbow { z-index: 3; }
    #canvas-scene   { z-index: 4; }   /* 山 + 雾 + 山脊积雹 */
    #canvas-fx      { z-index: 6; }
    #canvas-bolt    { z-index: 7; }

    #flash {
        position: fixed; inset: 0; z-index: 8;
        background: rgba(232, 236, 255, 1);
        opacity: 0; pointer-events: none;
    }
    .vignette {
        position: fixed; inset: 0; z-index: 9;
        background: radial-gradient(circle at 50% 38%, transparent 42%, rgba(0,0,0,0.5) 100%);
        pointer-events: none;
    }

    /* ── 观测站 UI ── */
    .stage {
        position: relative; z-index: 11;
        height: 100vh; height: 100dvh;
        display: flex; flex-direction: column;
        justify-content: center; align-items: flex-start;
        padding: 0 9%;
        pointer-events: none;
        perspective: 900px;
    }
    .stage > * { pointer-events: auto; }

    .brand { margin-bottom: 30px; pointer-events: none; user-select: none; }
    .brand span {
        font-size: 10px; letter-spacing: 6px; font-weight: 700;
        opacity: 0.45;
    }
    .brand h1 {
        font-size: clamp(36px, 5.4vw, 72px);
        font-weight: 300; line-height: 1.02; margin-top: 12px;
        letter-spacing: 0.5px;
    }
    .brand h1 em { font-style: normal; font-weight: 700; }

    .main-card {
        width: min(420px, 100%);
        background: rgba(255, 255, 255, 0.045);
        backdrop-filter: blur(22px) saturate(140%);
        -webkit-backdrop-filter: blur(22px) saturate(140%);
        /* --flash：雷落下那一刻描边 / 顶亮线 / 角刻线跟着一闪（tick 里逐帧写进来） */
        border: 1px solid rgba(255, 255, 255, calc(0.14 + var(--flash, 0) * 0.55));
        box-shadow: 0 36px 90px rgba(0,0,0,0.5),
                    inset 0 1px 0 rgba(255,255,255,calc(var(--flash, 0) * 0.5));
        padding: 26px 28px 22px;
        position: relative;
    }
    /* 角标记：仪器面板的四角刻线 */
    .main-card::before, .main-card::after {
        content: ''; position: absolute; width: 14px; height: 14px;
        border: 1px solid rgba(255,255,255,calc(0.4 + var(--flash, 0) * 0.4));
    }
    .main-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .main-card::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    /* 卡片内特效夹层：落雨的蠕滑水珠与积水画在玻璃与内容之间 */
    .card-fx {
        position: absolute; inset: 0;
        pointer-events: none;
        z-index: 0;
    }
    .main-card > *:not(.card-fx) { position: relative; z-index: 1; }

    .status-line {
        display: flex; align-items: center; gap: 10px;
        font-size: 9.5px; letter-spacing: 3px; font-weight: 700;
        opacity: 0.75; margin-bottom: 18px;
    }
    .led {
        width: 6px; height: 6px; border-radius: 50%;
        background: #fff; box-shadow: 0 0 10px #fff;
        animation: blink 2.2s infinite;
    }
    @keyframes blink { 50% { opacity: 0.25; } }

    .mood-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .mood-row h2 { font-size: 24px; font-weight: 500; letter-spacing: 1px; }
    .mood-row small {
        font-size: 10px; letter-spacing: 3px; font-weight: 700;
        opacity: 0.45;
    }
    #w-desc {
        font-size: 13px; line-height: 1.8; font-weight: 300;
        color: rgba(255,255,255,0.68);
        min-height: 3.6em;
        font-family: 'Noto Sans SC', sans-serif;
    }
    .data-grid {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 12px; margin-top: 18px; padding-top: 16px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }
    .dg small {
        display: block; font-size: 8.5px; letter-spacing: 2px;
        opacity: 0.4; font-weight: 700; margin-bottom: 5px;
    }
    .dg span {
        font-size: 15px; font-weight: 300;
        font-variant-numeric: tabular-nums;
    }
    .dg .bar {
        height: 2px; background: rgba(255,255,255,0.12);
        margin-top: 7px; position: relative; overflow: hidden;
    }
    .dg .bar i {
        position: absolute; inset: 0; transform-origin: left;
        background: rgba(255,255,255,0.75);
        transition: transform 0.6s ease;
    }

    /* ── 风格切换（冰雹 / 彩虹各自的 STYLE 行） ── */
    .style-row {
        display: none; align-items: center; gap: 8px;
        margin-top: 14px;
    }
    .style-row.on { display: flex; }
    .style-row small {
        font-size: 9px; letter-spacing: 2px; font-weight: 700;
        opacity: 0.4;
    }
    .style-chip {
        appearance: none; border: none; cursor: pointer;
        padding: 5px 13px; border-radius: 999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        color: rgba(255,255,255,0.6);
        font-family: inherit; font-size: 11px; letter-spacing: 1px;
        transition: background 0.3s, color 0.3s;
    }
    .style-chip.active {
        background: rgba(255,255,255,0.22);
        color: #fff;
    }

    /* ── 情绪 dock：方形仪表按钮 ── */
    .mood-dock {
        position: fixed; bottom: max(26px, env(safe-area-inset-bottom)); left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex; gap: 1px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.14);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .mood-btn {
        appearance: none; border: none; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 13px 22px 11px;
        background: rgba(5, 8, 14, 0.72);
        color: rgba(255,255,255,0.55);
        font-family: inherit; font-size: 10px; font-weight: 500;
        letter-spacing: 2px;
        transition: background 0.3s, color 0.3s;
        white-space: nowrap;
    }
    .mood-btn .e { font-size: 19px; filter: grayscale(0.7) brightness(1.2); transition: filter 0.3s; }
    .mood-btn:hover { color: #fff; }
    .mood-btn.active {
        background: rgba(255,255,255,0.14);
        color: #fff;
    }
    .mood-btn.active .e { filter: none; }

    /* ── 强度（顶部细线风格） ── */
    .intensity {
        position: fixed; top: max(24px, env(safe-area-inset-top)); left: 50%;
        transform: translateX(-50%);
        z-index: 20; width: min(320px, 72vw);
        background: rgba(5, 8, 14, 0.6);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 12px 20px 14px;
    }
    .intensity .lab {
        display: flex; justify-content: space-between;
        font-size: 9px; letter-spacing: 3px; font-weight: 700;
        opacity: 0.6; margin-bottom: 10px;
    }
    input[type=range] {
        width: 100%; -webkit-appearance: none; appearance: none;
        background: transparent; cursor: pointer; height: 14px;
    }
    input[type=range]::-webkit-slider-runnable-track {
        height: 2px; background: rgba(255,255,255,0.22);
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 12px; height: 12px;
        border-radius: 50%; background: #fff; margin-top: -5px;
        box-shadow: 0 0 12px rgba(255,255,255,0.6);
    }

    /* iOS 陀螺仪授权按钮：仅在需要用户手势授权的设备上显示 */
    #motion-btn {
        /* 放在 PRISM 正下方：两枚 fixed 按钮不再在右上角重叠 */
        position: fixed; top: calc(max(24px, env(safe-area-inset-top)) + 46px); right: 22px;
        z-index: 20; display: none;
        appearance: none; cursor: pointer;
        background: rgba(5, 8, 14, 0.6);
        border: 1px solid rgba(255,255,255,0.14);
        color: rgba(255,255,255,0.75);
        font-family: inherit; font-size: 9.5px; letter-spacing: 2px; font-weight: 700;
        padding: 10px 14px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }
    #motion-btn:hover { color: #fff; }

    @media (max-width: 760px) {
        .stage { padding: 0 22px; justify-content: flex-end; padding-bottom: 128px; }
        .brand h1 { font-size: 38px; }
        .mood-btn { padding: 11px 15px 9px; font-size: 0; gap: 0; }
        .mood-btn .e { font-size: 21px; }
    }
</style>
</head>
<body>

<div class="sky" id="sky-a"></div>
<div class="sky" id="sky-b"></div>

<canvas id="canvas-astro"></canvas>
<canvas id="canvas-cloud"></canvas>
<canvas id="canvas-rainbow"></canvas>
<canvas id="canvas-scene"></canvas>
<canvas id="canvas-fx"></canvas>
<canvas id="canvas-bolt"></canvas>
<div id="flash"></div>
<div class="vignette"></div>

<main class="stage">
    <header class="brand">
        <span>MOOD CLIMATE · B</span>
        <h1>Valley<br><em>Observatory.</em></h1>
    </header>
    <section class="main-card" id="card">
        <canvas class="card-fx" id="card-canvas"></canvas>
        <div class="status-line"><div class="led"></div><span id="w-status">SIMULATION ACTIVE</span></div>
        <div class="mood-row">
            <h2 id="w-name">放晴 / DAYBREAK</h2>
            <small id="w-mood">MOOD · CALM</small>
        </div>
        <p id="w-desc">正在初始化山谷模型……</p>
        <div class="data-grid">
            <div class="dg"><small>PARTICLES</small><span id="m-count">0</span><div class="bar"><i id="b-count"></i></div></div>
            <div class="dg"><small>INTENSITY</small><span id="m-int">65%</span><div class="bar"><i id="b-int"></i></div></div>
            <div class="dg"><small>DISCHARGE</small><span id="m-bolt">0</span><div class="bar"><i id="b-bolt"></i></div></div>
        </div>
        <div class="style-row" id="style-row">
            <small>STYLE</small>
            <span id="style-chips"></span>
        </div>
    </section>
</main>

<nav class="mood-dock" id="dock">
    <button class="mood-btn" data-w="clear"><span class="e">☀️</span>CALM</button>
    <button class="mood-btn" data-w="rainbow"><span class="e">🌈</span>JOY</button>
    <button class="mood-btn" data-w="rain"><span class="e">🌧️</span>RAIN</button>
    <button class="mood-btn" data-w="snow"><span class="e">❄️</span>SNOW</button>
    <button class="mood-btn" data-w="hail"><span class="e">🧊</span>IRRIT</button>
    <button class="mood-btn" data-w="storm"><span class="e">⛈️</span>ANGER</button>
</nav>

<div class="intensity">
    <div class="lab"><span>INTENSITY</span><span id="int-val">65%</span></div>
    <input type="range" id="slider" min="10" max="100" value="65">
</div>
<button id="motion-btn">◎ MOTION</button>
<button id="prism-btn">◮ PRISM</button>
<canvas id="lens-canvas"></canvas>

<script>
'use strict';

/* ════════════════════════════════════════════
   0. 天气 Profile —— 每种情绪一个时辰
   mountain: 三层山的色（远→近） fog: 谷间雾
   ════════════════════════════════════════════ */
const WEATHERS = {
    clear: {
        name: '放晴 / DAYBREAK', mood: 'MOOD · CALM', status: 'DAWN SEQUENCE',
        desc: '心情平静。夜班结束了，残星还挂在头顶，地平线先亮起来，雾从谷底一层一层退。',
        sky: 'linear-gradient(180deg, #1b2947 0%, #3d5578 42%, #c47f4e 78%, #f2b96a 100%)',
        mountains: [[38, 52, 84], [26, 37, 62], [14, 21, 38]],
        horizonGlow: { color: [255, 178, 96], strength: 0.55 },
        stars: 0.6, cloud: { count: 2, alpha: 0.1, tint: [255, 210, 170] },
        fog: 0.35, rainbow: 0,
        hail: 0, rain: 0, bolt: 0, dust: 1, snow: 0, glassdrops: 0
    },
    rainbow: {
        name: '彩虹 / AFTERRAIN', mood: 'MOOD · JOY', status: 'SPECTRUM LOCK',
        desc: '心情很好。晨雨刚过，山谷里全是悬着的水汽，光一进来，就排成了七色的队。',
        sky: 'linear-gradient(180deg, #37548a 0%, #6a89ae 45%, #c9b98c 82%, #e8d6a4 100%)',
        mountains: [[64, 84, 116], [44, 60, 88], [24, 34, 54]],
        horizonGlow: { color: [255, 226, 160], strength: 0.4 },
        stars: 0, cloud: { count: 5, alpha: 0.2, tint: [255, 255, 255] },
        fog: 0.6, rainbow: 1,
        hail: 0, rain: 0.15, bolt: 0, dust: 0.6, snow: 0, glassdrops: 0,
        /* 三种真实存在的虹：经典双虹 / fogbow 白雾虹 / moonbow 月虹（夜空银白，B 独有） */
        styles: { neon: '霓光', fog: '雾虹', moon: '月虹' }
    },
    hail: {
        name: '冰雹 / WHITEOUT', mood: 'MOOD · IRRITATED', status: 'IMPACT ALERT',
        desc: '有点烦躁。铅灰色的白昼，冰粒砸在山脊上积成一条白线，谷里的每一声回响都很硬。',
        sky: 'linear-gradient(180deg, #4a5666 0%, #39434f 55%, #232a33 100%)',
        mountains: [[70, 80, 92], [48, 56, 66], [28, 33, 41]],
        horizonGlow: { color: [180, 195, 210], strength: 0.12 },
        stars: 0, cloud: { count: 7, alpha: 0.34, tint: [140, 152, 166] },
        fog: 0.25, rainbow: 0,
        hail: 1, rain: 0, bolt: 0, dust: 0, snow: 0, glassdrops: 0,
        styles: { crystal: '琉璃珠', shatter: '碎冰暴' }
    },
    storm: {
        name: '雷暴 / DISCHARGE', mood: 'MOOD · ANGRY', status: 'CELL OVERHEAD',
        desc: '情绪激烈。观测站正上方有一个雷暴单体，云在内部放电，山脊每隔几秒被照成剪影。',
        sky: 'linear-gradient(180deg, #191430 0%, #0f0c1e 55%, #060510 100%)',
        mountains: [[42, 36, 66], [26, 22, 44], [12, 10, 24]],
        horizonGlow: { color: [110, 96, 180], strength: 0.1 },
        stars: 0, cloud: { count: 8, alpha: 0.42, tint: [72, 64, 110] },
        fog: 0.2, rainbow: 0,
        hail: 0, rain: 1.4, bolt: 1, dust: 0, snow: 0, glassdrops: 0.8
    },
    /* 朋友原作《落雨与积水》《落雪与积雪》的两个天气，接进同一引擎。
       glassdrops = 玻璃挂水珠的权重（rain 满、storm 0.8），驱动卡片夹层 drawCardFx 与透镜 ⑥ */
    rain: {
        name: '落雨 / RAINFALL', mood: 'MOOD · MELANCHOLY', status: 'STEADY PRECIP',
        desc: '有点难过。雨不大也不小，就是不停，谷里的雾一直没散，观测窗上的水珠一颗一颗排着队往下走。',
        sky: 'linear-gradient(180deg, #2c3b4d 0%, #435669 50%, #5a6d80 100%)',
        mountains: [[72, 90, 108], [48, 64, 82], [28, 40, 56]],
        horizonGlow: { color: [140, 165, 190], strength: 0.1 },
        stars: 0, cloud: { count: 6, alpha: 0.28, tint: [138, 154, 172] },
        fog: 0.55, rainbow: 0,
        hail: 0, rain: 0.95, bolt: 0, dust: 0, snow: 0, glassdrops: 1
    },
    snow: {
        name: '落雪 / SNOWFALL', mood: 'MOOD · SERENE', status: 'SIGNAL MUTED',
        desc: '心很静。雪把山谷的音量关小了，仪表上只剩落雪的读数在慢慢累加，山脊一点一点变白。',
        sky: 'linear-gradient(180deg, #5c6a80 0%, #8492a6 45%, #b5bfcc 100%)',
        mountains: [[156, 168, 186], [122, 135, 154], [90, 102, 122]],
        horizonGlow: { color: [225, 232, 242], strength: 0.14 },
        stars: 0, cloud: { count: 6, alpha: 0.32, tint: [214, 220, 230] },

/* 彩虹三风格会临时改写 rainbow profile 的天空/星空/地平线光

const RB_BASE = {

/* ════════════════════════════════════════════
   1. 全局状态 + 风场 + 视差（陀螺仪 / 鼠标 / idle 光漂移）
   ════════════════════════════════════════════ */
let current = 'clear';
let intensity = 65;
const W = {};
Object.keys(WEATHERS).forEach(k => W[k] = 0);
W.clear = 1;

let vw = innerWidth, vh = innerHeight;
let lastT = performance.now();

/* 全局风场：所有下落物共享一个倾角，缓慢摆动；雷击时叠阵风 gust */
const wind = { x: 1.1, t: Math.random() * 100, gust: 0 };
function stepWind(dt) {
    wind.t += dt * 0.00022;

/* 视差核心：par.x / par.y ∈ [-1,1]，三种来源，平滑趋近 */

function feedParallax(nx, ny) {
    par.tx = Math.max(-1, Math.min(1, nx));
    par.ty = Math.max(-1, Math.min(1, ny));

}
addEventListener('mousemove', e => {
    feedParallax((e.clientX / vw - 0.5) * 2, (e.clientY / vh - 0.5) * 2);

/* 触屏：在背景上拖动 = 移动视角（没有陀螺仪也能「摇」）；落在 UI 上就不抢 */
addEventListener('touchmove', e => {
    const t = e.target;
    if (t.closest && t.closest('.mood-dock, .intensity, .main-card, #motion-btn, #lens-canvas, #prism-btn')) return;
    const tp = e.touches[0];
    feedParallax((tp.clientX / vw - 0.5) * 2.4, (tp.clientY / vh - 0.5) * 2.4);

    if (e.gamma == null || e.beta == null) return;

    mb.style.display = 'block';

}
function stepParallax(dt, now) {

    if (now - par.lastInput > 8000) {
        par.idleT += dt * 0.00013;
        par.tx = Math.sin(par.idleT) * 0.55;
        par.ty = Math.cos(par.idleT * 0.71) * 0.35;
    }

    par.y += (par.ty - par.y) * 0.045 * (dt / 16);

const $ = id => document.getElementById(id);
const cvs = {
    astro: $('canvas-astro'), cloud: $('canvas-cloud'), rainbow: $('canvas-rainbow'),
    scene: $('canvas-scene'), fx: $('canvas-fx'), bolt: $('canvas-bolt')

const ctx = {};
for (const k in cvs) ctx[k] = cvs[k].getContext('2d');

function resize() {
    vw = innerWidth; vh = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    for (const k in cvs) {
        cvs[k].width = Math.round(vw * dpr);
        cvs[k].height = Math.round(vh * dpr);

        cvs[k].style.height = vh + 'px';
        ctx[k].setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    buildMountains();
    buildStars();
    resizeRidgeField();
    updateCardRect();
    rbCache = null;    /* 彩虹贴图按视口尺寸缓存，换尺寸必须重建 */
}
addEventListener('resize', resize);

/* 冰雹会砸在观测卡片顶边上、雪会积在顶边上，碰撞用这份缓存的矩形 */
let cardRect = { left: 0, top: 0, right: 0, bottom: 0, width: 0, height: 0 };
function updateCardRect() {
    const r = $('card').getBoundingClientRect();
    cardRect = { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
    /* 卡片内特效夹层跟着卡片尺寸走（落雨的水珠与积水在这层画） */
    const cc = $('card-canvas');
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    if (cc.width !== Math.round(w * dpr) || cc.height !== Math.round(h * dpr)) {
        cc.width = Math.round(w * dpr);
        cc.height = Math.round(h * dpr);
        cc.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    /* 卡片顶积雪高度场按卡片宽度重建 */
    if (typeof resizeSnowField === 'function') resizeSnowField();
}

const lerp = (a, b, t) => a + (b - a) * t;
function mixColor(prop, idx) {
    /* 按权重混合 WEATHERS[k][prop][idx]（rgb 数组） */
    let r = 0, g = 0, b = 0, tw = 0;
    for (const k in W) {
        const c = idx == null ? WEATHERS[k][prop] : WEATHERS[k][prop][idx];
        const w = W[k];
        r += c[0] * w; g += c[1] * w; b += c[2] * w; tw += w;
    }
    if (tw < 0.001) return [0, 0, 0];
    return [r / tw, g / tw, b / tw];
}
function weightOf(prop) {
    let v = 0;
    for (const k in W) v += (WEATHERS[k][prop] || 0) * W[k];
    return v;
}

/* 观测卡片带 backdrop-filter，逐帧改 3D transform 会让 iOS 每帧重采样模糊；
   仪表风不需要 tilt，DOM 侧不再做视差 */

/* ════════════════════════════════════════════
   2. 山 —— 三层视差山脊（1D value noise 生成一次）
   ════════════════════════════════════════════ */
let mountains = [];   // [{pts:[[x,y]..], base}] 远→近
function ridge(seedArr, baseY, amp, step) {
    const pts = [];
    for (let x = -20; x <= vw + 20; x += step) {
        let y = 0, f = 1, a = 1, tot = 0;
        for (let o = 0; o < 3; o++) {
            const t = (x * f) / 340 + seedArr[o];
            const i0 = Math.floor(t), fr = t - i0;
            const v0 = pseudo(i0 + o * 57), v1 = pseudo(i0 + 1 + o * 57);
            y += lerp(v0, v1, fr * fr * (3 - 2 * fr)) * a;
            tot += a; f *= 2.1; a *= 0.45;
        }
        pts.push([x, baseY - (y / tot) * amp]);
    }
    return pts;
}
function pseudo(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

function buildMountains() {
    mountains = [
        { pts: ridge([1.7, 8.2, 3.9], vh * 0.62, vh * 0.2, 14), layer: 0 },
        { pts: ridge([9.4, 2.6, 6.1], vh * 0.74, vh * 0.24, 10), layer: 1 },
        { pts: ridge([4.8, 5.5, 0.7], vh * 0.9, vh * 0.26, 8),  layer: 2 }
    ];
}

/* 最近一层山脊的积雹高度场 */
const RIDGE_RES = 4;
let ridgeField = new Float32Array(0);
function resizeRidgeField() {
    ridgeField = new Float32Array(Math.ceil(vw / RIDGE_RES) + 2);
}
function ridgeYAt(x) {
    /* 最前层山脊在 x 处的 y（线性插值） */
    const m = mountains[2];
    if (!m) return vh;
    const step = 8;
    const i = Math.max(0, Math.min(m.pts.length - 2, Math.floor((x + 20) / step)));
    const [x0, y0] = m.pts[i], [x1, y1] = m.pts[i + 1];
    const t = Math.max(0, Math.min(1, (x - x0) / (x1 - x0 || 1)));
    return lerp(y0, y1, t);
}

/* 山的层深视差：远层动得少、近层动得多。碰撞在世界坐标做，
   所以山脊绑定的粒子/闪电绘制层都必须复用最前层的 MPX[2]/MPY[2] */
const MPX = [-6, -12, -20], MPY = [-3, -6, -10];

function drawScene(dt, now) {
    const g = ctx.scene;
    g.clearRect(0, 0, vw, vh);

    /* 三层山（每层带自己的视差偏移） */
    mountains.forEach((m, i) => {
        g.save();
        g.translate(par.x * MPX[i], par.y * MPY[i]);
        const c = mixColor('mountains', i);
        g.fillStyle = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
        g.beginPath();
        g.moveTo(-20, vh + 10);
        m.pts.forEach(p => g.lineTo(p[0], p[1]));
        g.lineTo(vw + 20, vh + 10);
        g.closePath();
        g.fill();

        /* 谷间雾：画在远山与中山之间（跟着所在层一起动） */
        if (i < 2) {
            const fogA = weightOf('fog') * (i === 0 ? 0.5 : 0.35);
            if (fogA > 0.01) {
                const fy = i === 0 ? vh * 0.58 : vh * 0.72;
                const fg = g.createLinearGradient(0, fy - vh * 0.1, 0, fy + vh * 0.08);
                fg.addColorStop(0, 'rgba(200,214,228,0)');
                fg.addColorStop(0.55, `rgba(200,214,228,${fogA})`);
                fg.addColorStop(1, 'rgba(200,214,228,0)');
                g.fillStyle = fg;
                g.fillRect(0, fy - vh * 0.1, vw, vh * 0.2);
            }
        }
        g.restore();
    });

    /* 山脊积雹 / 积雪白线（heightfield 顶在最前层山脊上，跟前层同一份视差；
       雹与雪共用一份 ridgeField，雹天慢融、雪天更慢） */
    let hasIce = false;
    const melt = (W.hail > 0.5 ? 0.003 : (W.snow > 0.5 ? 0.0016 : 0.04)) * (dt / 16);
    for (let i = 0; i < ridgeField.length; i++) {
        if (ridgeField[i] > 0) {
            ridgeField[i] -= melt;
            if (i > 0 && i < ridgeField.length - 1)
                ridgeField[i] = ridgeField[i] * 0.93 + (ridgeField[i - 1] + ridgeField[i + 1]) * 0.035;
            if (ridgeField[i] < 0) ridgeField[i] = 0; else hasIce = true;
        }
    }
    if (hasIce) {
        g.save();
        g.translate(par.x * MPX[2], par.y * MPY[2]);
        g.beginPath();
        let started = false;
        for (let i = 0; i < ridgeField.length; i++) {
            const x = i * RIDGE_RES;
            const y = ridgeYAt(x) - ridgeField[i];
            if (!started) { g.moveTo(x, y); started = true; }
            else g.lineTo(x, y);
        }
        for (let i = ridgeField.length - 1; i >= 0; i--) {
            const x = i * RIDGE_RES;
            g.lineTo(x, ridgeYAt(x) + 1.5);
        }
        g.closePath();
        g.fillStyle = 'rgba(235,244,252,0.85)';
        g.fill();
        g.restore();
    }

    /* 地平线光带（放晴的破晓 / 彩虹的晨光 / 月虹的冷银） */
    let glowC = [0, 0, 0], glowS = 0;
    for (const k in W) {
        const hg = WEATHERS[k].horizonGlow;
        glowC[0] += hg.color[0] * W[k]; glowC[1] += hg.color[1] * W[k]; glowC[2] += hg.color[2] * W[k];
        glowS += hg.strength * W[k];
    }
    if (glowS > 0.02) {
        /* 光心随视差微移 + 两个不可通约慢正弦的呼吸——不再是唯一完全静止的元素 */
        const breathe = 0.9 + 0.06 * Math.sin(now * 0.00037) + 0.04 * Math.sin(now * 0.00071);
        g.save();
        g.globalCompositeOperation = 'screen';
        const hx = vw * 0.5 + par.x * 30, hy = vh * 0.6 + par.y * 20;
        const hg = g.createRadialGradient(hx, hy, 0, hx, hy, vw * 0.7);
        hg.addColorStop(0, `rgba(${glowC[0] | 0},${glowC[1] | 0},${glowC[2] | 0},${glowS * breathe * 0.5})`);
        hg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = hg;
        g.fillRect(0, 0, vw, vh);
        g.restore();
    }
}

/* ════════════════════════════════════════════
   3. 星空 + 卫星（放晴的残星 / 月虹的夜空）
   ════════════════════════════════════════════ */
let stars = [];
function buildStars() {
    stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * vw,
        y: Math.random() * vh * 0.5,
        r: 0.4 + Math.random() * 1.1,
        ph: Math.random() * Math.PI * 2,
        sp: 0.008 + Math.random() * 0.02
    }));
}
let sat = { x: -30, y: 0.12, v: 0.22 };   /* 一颗慢慢划过的卫星 */

function drawAstro(dt) {
    const g = ctx.astro;
    g.clearRect(0, 0, vw, vh);
    const vis = weightOf('stars');
    if (vis < 0.02) return;
    g.save();
    g.translate(par.x * -4, par.y * -2);   /* 星空是最远的层：视差最小 */
    stars.forEach(s => {
        s.ph += s.sp * (dt / 16);
        const tw = 0.4 + 0.6 * Math.abs(Math.sin(s.ph));
        /* 星在天顶亮、近地平线淡（被晨光吃掉） */
        const hFade = 1 - s.y / (vh * 0.55);
        g.fillStyle = `rgba(255,255,255,${0.7 * tw * vis * hFade})`;
        g.fillRect(s.x, s.y, s.r, s.r);
    });
    /* 卫星：一个缓慢移动的小亮点 */
    sat.x += sat.v * (dt / 16);
    if (sat.x > vw + 30) { sat.x = -30; sat.y = 0.06 + Math.random() * 0.2; }
    g.fillStyle = `rgba(255,255,255,${0.8 * vis})`;
    g.beginPath();
    g.arc(sat.x, vh * sat.y, 1.1, 0, Math.PI * 2);
    g.fill();
    g.restore();
}

/* ════════════════════════════════════════════
   4. 云（sprite 思路同 A，色调可染 + 层深视差）
   ════════════════════════════════════════════ */
function makeCloudSprite() {
    const c = document.createElement('canvas');
    c.width = 480; c.height = 240;
    const g = c.getContext('2d');
    for (let i = 0; i < 9; i++) {
        const r = 45 + Math.random() * 65;
        /* 圆整个落在画布里：边缘不会被画布裁成一条直线 */
        const x = r + Math.random() * (480 - 2 * r), y = r + Math.random() * (240 - 2 * r);
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.5)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    return c;
}
const cloudSprites = [makeCloudSprite(), makeCloudSprite(), makeCloudSprite()];
class Cloud {
    constructor(i) {
        this.sprite = cloudSprites[i % 3];
        this.depth = 0.4 + Math.random() * 0.6;   /* 视差深度 */
        this.reset(true);
    }
    reset(init) {
        this.scale = 1.1 + Math.random() * 2.2;
        this.x = init ? Math.random() * vw - 240 : -480 * this.scale;
        this.y = -70 + Math.random() * vh * 0.34;
        this.v = 0.09 + Math.random() * 0.26;
        this.o = 0.5 + Math.random() * 0.5;
    }
    step(dt) {
        /* 云的平移吃一点全局风：风大时整层云都走得快 */
        this.x += (this.v + wind.x * 0.06) * (dt / 16);
        if (this.x > vw + 60) this.reset(false);
    }
}
const clouds = Array.from({ length: 8 }, (_, i) => new Cloud(i));

function drawClouds() {
    const g = ctx.cloud;
    g.clearRect(0, 0, vw, vh);
    let alpha = 0, count = 0, tint = [0, 0, 0], tw = 0;
    for (const k in W) {
        const p = WEATHERS[k].cloud, w = W[k];
        alpha += p.alpha * w; count += p.count * w;
        tint[0] += p.tint[0] * w; tint[1] += p.tint[1] * w; tint[2] += p.tint[2] * w; tw += w;
    }
    if (alpha < 0.01 || tw < 0.01) return;
    tint = tint.map(v => v / tw);
    /* 彩虹进行时：云随雨停逐渐散掉（走向放晴） */
    const cloudFade = 1 - Math.min(rbAge / 32, 0.5) * W.rainbow;
    clouds.forEach((c, i) => {
        if (i >= Math.round(count * cloudFade)) return;
        g.globalAlpha = alpha * cloudFade * c.o;
        g.drawImage(c.sprite,
            c.x + par.x * -18 * c.depth, c.y + par.y * -10 * c.depth,
            480 * c.scale, 240 * c.scale);
    });
    g.globalAlpha = 1;
    g.save();          /* 染色 */
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = `rgba(${tint[0] | 0},${tint[1] | 0},${tint[2] | 0},0.55)`;
    g.fillRect(0, 0, vw, vh);
    g.restore();
}

/* ════════════════════════════════════════════
   5. 彩虹 v3 —— 连续光谱（内亮 · Alexander 暗带 ·
      supernumerary · 副虹）+ 真实显影：虹脚先亮 → 整弧
      + shimmer + 视角（视差）位移
      三风格：霓光（经典双虹）/ 雾虹（fogbow）/ 月虹（moonbow）
   ════════════════════════════════════════════ */
let rbGrow = 0, rbShimT = 0;
let rbAge = 0;            /* 彩虹态的年龄（秒）：驱动 雨停 → 云散 → 虹峰值 → 缓慢淡去 */
let rbRainStopped = false;
let rbCache = null;
const easeOut = t => 1 - Math.pow(1 - t, 3);

function buildRainbowSprite() {
    const S = 3;
    /* 出血 80px：视差移动贴图时不露边（否则出现垂直截断线） */
    const BLEED = 80;
    const w = Math.ceil((vw + BLEED * 2) / S), h = Math.ceil((vh + BLEED * 2) / S);
    const portrait = vh > vw;
    const apexY = vh * (portrait ? 0.3 : 0.2);
    const CX = vw * 0.55 + BLEED, CY = vh * 1.25 + BLEED;
    const R = (CY - (apexY + BLEED)) / S;
    const cx = CX / S, cy = CY / S;
    const A = 1;          /* 浓淡交给各风格的 stop 值与 INTENSITY */
    const WD = 1;

    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    const kind = styleSel.rainbow;

    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, R);
    const stop = (t, r, gr, b, a) => grad.addColorStop(Math.max(0, Math.min(1, t)), `rgba(${r},${gr},${b},${a * A})`);
    /* 月虹的内侧亮盘压暗一半：月光弱，盘内散射也弱 */
    const IN = kind === 'moon' ? 0.5 : 1;
    stop(0.0, 255, 255, 255, 0);
    stop(0.62, 255, 255, 255, 0.03 * IN);
    stop(0.80, 255, 253, 248, 0.1 * IN);
    stop(0.868, 255, 252, 244, 0.14 * IN);
    if (kind === 'neon') {
        /* supernumerary 干涉纹（两圈渐密） */
        stop(0.874, 200, 160, 255, 0.15);
        stop(0.880, 160, 230, 170, 0.12);
        stop(0.886, 255, 255, 255, 0.06);
        const b0 = 0.892, span = (0.985 - 0.892) * WD;
        const at = t => b0 + span * t;
        stop(at(0.00), 150, 95, 245, 0.26);
        stop(at(0.16), 88, 128, 255, 0.32);
        stop(at(0.32), 70, 195, 220, 0.34);
        stop(at(0.48), 108, 222, 96, 0.36);
        stop(at(0.66), 252, 228, 72, 0.4);
        stop(at(0.82), 255, 158, 52, 0.4);
        stop(at(0.95), 255, 74, 58, 0.36);
        stop(Math.min(1, at(1.0) + 0.005), 255, 60, 60, 0);
    } else if (kind === 'fog') {
        /* fogbow：水滴太小、衍射抹掉色彩——宽白带 + 极淡蓝内缘红外缘 */
        stop(0.858, 150, 180, 255, 0.14);
        stop(0.878, 235, 240, 250, 0.36);
        stop(0.92, 255, 255, 255, 0.52);
        stop(0.962, 255, 235, 225, 0.34);
        stop(0.985, 255, 160, 140, 0.12);
        stop(1, 255, 140, 120, 0);
    } else {
        /* 月虹：月光太弱，人眼锥细胞不工作——近乎无色的银白带，
           内缘一点冷蓝，外缘一丝极淡的暖白 */
        stop(0.862, 170, 195, 240, 0.08);
        stop(0.888, 205, 222, 248, 0.18);
        stop(0.925, 235, 242, 252, 0.30);
        stop(0.958, 244, 242, 234, 0.16);
        stop(0.985, 246, 238, 226, 0.05);
        stop(1, 246, 238, 226, 0);
    }
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);

    if (kind !== 'fog') {
        /* Alexander 暗带（fogbow 没有清晰暗带；月虹的暗带也淡） */
        const DK = kind === 'moon' ? 0.55 : 1;
        const dark = g.createRadialGradient(cx, cy, R, cx, cy, R * 1.13);
        dark.addColorStop(0, 'rgba(20,26,44,0)');
        dark.addColorStop(0.3, `rgba(20,26,44,${0.1 * A * DK})`);
        dark.addColorStop(0.75, `rgba(20,26,44,${0.09 * A * DK})`);
        dark.addColorStop(1, 'rgba(20,26,44,0)');
        g.fillStyle = dark;
        g.fillRect(0, 0, w, h);

        /* 副虹（色序反转、约主虹三至五成亮度；月虹的副虹只剩一圈极淡的银） */
        const R2 = R * 1.19;
        const grad2 = g.createRadialGradient(cx, cy, 0, cx, cy, R2);
        const s2 = (t, r, gr, b, a) => grad2.addColorStop(Math.max(0, Math.min(1, t)), `rgba(${r},${gr},${b},${a * A})`);
        if (kind === 'neon') {
            s2(0.90, 255, 60, 60, 0);
            s2(0.912, 255, 84, 62, 0.12);
            s2(0.928, 255, 170, 60, 0.13);
            s2(0.944, 245, 225, 80, 0.13);
            s2(0.958, 110, 218, 100, 0.12);
            s2(0.972, 80, 150, 250, 0.12);
            s2(0.986, 155, 100, 245, 0.1);
            s2(1.0, 160, 95, 245, 0);
        } else {
            s2(0.9, 235, 240, 250, 0);
            s2(0.94, 235, 240, 250, 0.06);
            s2(0.97, 238, 240, 248, 0.045);
            s2(1.0, 238, 240, 248, 0);
        }
        g.globalCompositeOperation = 'lighter';
        g.fillStyle = grad2;
        g.fillRect(0, 0, w, h);
    }

    /* 顶部薄、底部收进地景 */
    g.globalCompositeOperation = 'destination-out';
    const topFade = g.createLinearGradient(0, 0, 0, h);
    topFade.addColorStop(0, 'rgba(0,0,0,0.4)');
    topFade.addColorStop(0.35, 'rgba(0,0,0,0)');
    topFade.addColorStop(0.78, 'rgba(0,0,0,0)');
    topFade.addColorStop(1, 'rgba(0,0,0,0.85)');
    g.fillStyle = topFade;
    g.fillRect(0, 0, w, h);

    rbCache = { cv, apexY, bleed: BLEED, cxS: vw * 0.55, cyS: vh * 1.25, rS: vh * 1.25 - apexY };
}

function drawRainbow(dt) {
    const g = ctx.rainbow;
    g.clearRect(0, 0, vw, vh);
    const vis = weightOf('rainbow');
    /* 显影：真实彩虹是阳光穿透雨幕后「显」出来的，8 秒左右到全亮 */
    rbGrow += ((vis > 0.05 ? 1 : 0) - rbGrow) * 0.010 * (dt / 16);
    if (vis < 0.01 || rbGrow < 0.012) return;
    if (!rbCache) buildRainbowSprite();
    rbShimT += dt * 0.0005;
    const grow = easeOut(rbGrow);
    /* shimmer：像雨幕在风里晃，亮度轻微起伏 */
    const shim = 1 + Math.sin(rbShimT * 2.4) * 0.05 + Math.sin(rbShimT * 5.7) * 0.03;
    /* 真实彩虹只有 5-15 分钟：峰值之后随雨幕散去缓慢变淡（demo 里 40 秒后开始，最低留 55%） */
    const fade = rbAge < 40 ? 1 : Math.max(0.55, 1 - (rbAge - 40) * 0.012);
    /* 视角位移：彩虹跟着观察者，视差里它反向微移 */
    const ox = par.x * -30, oy = par.y * -12;

    /* INTENSITY 滑杆 = 虹的深浅 */
    const depth = 0.35 + (intensity / 100) * 0.85;
    const a = Math.min(1, vis * grow * shim * fade * depth);
    const B = rbCache.bleed;
    g.save();
    /* 两遍混合：screen 出光感（暗背景亮），source-over 保证亮天空上也显色 */
    g.globalCompositeOperation = 'screen';
    g.globalAlpha = a;
    g.drawImage(rbCache.cv, ox - B, oy - B, vw + B * 2, vh + B * 2);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = a * 0.5;
    g.drawImage(rbCache.cv, ox - B, oy - B, vw + B * 2, vh + B * 2);
    g.restore();
}

/* 三种虹各带自己的天色：月虹换夜空（星空回来、地平线转冷银），
   雾虹整谷罩灰白雾，霓光回默认晨霁 —— 统一从这里走，好还原 */
function applyRainbowStyle(key) {
    rbCache = null;
    rbGrow *= 0.25;   /* 新风格重新显影一段，避免弧体硬切 */
    const p = WEATHERS.rainbow;
    if (key === 'moon') {
        p.sky = 'linear-gradient(180deg, #0a1226 0%, #16223c 55%, #1c2a44 100%)';
        p.stars = 0.8;
        p.horizonGlow = { color: [180, 200, 230], strength: 0.18 };
    } else if (key === 'fog') {
        p.sky = 'linear-gradient(180deg, #6b7684 0%, #8a94a0 55%, #a8b0b8 100%)';
        p.stars = RB_BASE.stars;
        p.horizonGlow = RB_BASE.horizonGlow;
    } else {
        p.sky = RB_BASE.sky;
        p.stars = RB_BASE.stars;
        p.horizonGlow = RB_BASE.horizonGlow;
    }
    if (current === 'rainbow') flipSky(p.sky);
}

/* ════════════════════════════════════════════
   6. 冰雹 v3 —— 清冰壳+乳白核 sprite · 磕弹白印 ·
      碎冰片 · 水渍 · 融化白汽；落点是最前层山脊

function makeHailSprite() {
    const SZ = 64, C = SZ / 2;
    const cv = document.createElement('canvas');
    cv.width = cv.height = SZ;
    const g = cv.getContext('2d');
    const R = 24;
    const lobes = [{ x: 0, y: 0, r: R }];
    const nl = 2 + (Math.random() < 0.5 ? 1 : 0);
    for (let i = 0; i < nl; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = R * (0.3 + Math.random() * 0.25);
        lobes.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: R * (0.5 + Math.random() * 0.3) });
    }
    const outline = () => {
        g.beginPath();
        lobes.forEach(l => { g.moveTo(C + l.x + l.r, C + l.y); g.arc(C + l.x, C + l.y, l.r, 0, Math.PI * 2); });
    };
    outline();
    g.save();
    g.clip();
    const shell = g.createRadialGradient(C, C, R * 0.1, C, C, R * 1.28);
    shell.addColorStop(0, 'rgba(235,244,255,0.10)');
    shell.addColorStop(0.55, 'rgba(225,238,252,0.16)');
    shell.addColorStop(0.82, 'rgba(240,248,255,0.46)');
    shell.addColorStop(1, 'rgba(255,255,255,0.06)');
    g.fillStyle = shell;
    g.fillRect(0, 0, SZ, SZ);
    const nx = C - R * 0.15, ny = C - R * 0.1;
    const core = g.createRadialGradient(nx, ny, 0, nx, ny, R * 0.62);
    core.addColorStop(0, 'rgba(255,255,255,0.5)');
    core.addColorStop(0.55, 'rgba(244,250,255,0.24)');
    core.addColorStop(1, 'rgba(244,250,255,0)');
    g.fillStyle = core;
    g.fillRect(0, 0, SZ, SZ);
    g.strokeStyle = 'rgba(210,230,250,0.4)';
    g.lineWidth = 2;
    g.beginPath();
    g.arc(C, C + R * 0.12, R * 0.8, Math.PI * 0.18, Math.PI * 0.82);
    g.stroke();
    g.restore();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath();
    g.ellipse(C - R * 0.42, C - R * 0.45, R * 0.16, R * 0.1, -0.6, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.beginPath();
    g.arc(C + R * 0.3, C - R * 0.12, R * 0.07, 0, Math.PI * 2);
    g.fill();
    return cv;
}
const hailSprites = Array.from({ length: 5 }, makeHailSprite);

function makeShardSprite() {
    const SZ = 24, C = SZ / 2;
    const cv = document.createElement('canvas');
    cv.width = cv.height = SZ;
    const g = cv.getContext('2d');
    const n = 4 + (Math.random() * 2 | 0);
    g.beginPath();
    for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + Math.random() * 0.7;
        const r = 5 + Math.random() * 6;
        const x = C + Math.cos(a) * r, y = C + Math.sin(a) * r;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
    const grad = g.createLinearGradient(0, 0, SZ, SZ);
    grad.addColorStop(0, 'rgba(240,248,255,0.7)');
    grad.addColorStop(0.5, 'rgba(220,236,252,0.28)');
    grad.addColorStop(1, 'rgba(255,255,255,0.55)');
    g.fillStyle = grad;
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.5)';
    g.lineWidth = 0.8;
    g.stroke();
    return cv;
}
const shardSprites = Array.from({ length: 4 }, makeShardSprite);

const parts = [], shards = [], puddles = [], restHail = [], impacts = [], mists = [];

/* ── 雪：软片 sprite 三档景深 + 高度场积雪（积雪继承《落雪与积雪》的招牌）
      A 版验收后改规格：不画晶体、不旋转、不描边、无 shadowBlur；
      摆动小而慢，横向速度 lerp 平滑不瞬变。
      落点：观测卡片顶（snowField）/ 最前层山脊（与冰雹共用 ridgeField） ── */

/* 软雪片 sprite：radialGradient 圆点（中心 0.9 → 半径一半 0.4 → 边缘 0），
   中/近层微蓝白 rgb(222,228,253)，远层杂灰白压灰 */
function makeSoftFlake(rgb) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 20;
    const g = cv.getContext('2d');
    const grad = g.createRadialGradient(10, 10, 0, 10, 10, 9);
    grad.addColorStop(0, `rgba(${rgb},0.9)`);
    grad.addColorStop(0.5, `rgba(${rgb},0.4)`);
    grad.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 20, 20);
    return cv;
}
const softFlakeFar = makeSoftFlake('205,210,228');    /* 远层偏灰 */
const softFlakeNear = makeSoftFlake('222,228,253');   /* 中 / 近层微蓝白 */
let snowAir = 0;       /* 空中雪的显隐：进雪 1 秒亮起，离开雪 4 秒左右从空气里化掉 */
/* 卡片顶沉积按 A 校准（近/中/远 ≈ 3.2 / 2.0 / 1.1）：只乘在卡片那一路，山脊积雪率不动 */
const SNOW_CARD_MASS = 1.44;

/* 三档景深：r / alpha / 竖直速度（px/帧）/ 抽中权重（远:中:近 ≈ 5:3:1.5）/ 积雪质量与铺展半径 */
const SNOW_TIERS = [
    { p: 5,   r: [0.8, 1.6], o: [0.35, 0.5],  vy: [0.35, 0.6], far: true,  mass: 0.8, rad: 3 },
    { p: 3,   r: [1.6, 2.8], o: [0.6, 0.8],   vy: [0.6, 1.0],  far: false, mass: 1.4, rad: 3 },
    { p: 1.5, r: [2.8, 4.6], o: [0.75, 0.95], vy: [1.0, 1.6],  far: false, mass: 2.2, rad: 4 }
];
const SNOW_P_TOTAL = SNOW_TIERS.reduce((a, t) => a + t.p, 0);
const randIn = (lo, hi) => lo + Math.random() * (hi - lo);

/* 卡片顶积雪高度场 */
const SNOW_RES = 3;
let snowField = new Float32Array(0);
function resizeSnowField() {
    const n = Math.ceil(Math.max(1, cardRect.width) / SNOW_RES) + 2;
    if (snowField.length === n) return;          /* 宽度没变就不动：换天气不清雪堆（之前一刀切没了） */
    const nf = new Float32Array(n);
    for (let i = 0; i < n && snowField.length; i++)
        nf[i] = snowField[Math.min(snowField.length - 1, Math.round(i * snowField.length / n))] || 0;
    snowField = nf;
}

class SnowFlake {
    constructor() {
        let pick = Math.random() * SNOW_P_TOTAL, tier = 0;
        for (let i = 0; i < SNOW_TIERS.length; i++) {
            pick -= SNOW_TIERS[i].p;
            if (pick < 0) { tier = i; break; }
        }
        const T = SNOW_TIERS[tier];
        this.tier = tier;
        this.sprite = T.far ? softFlakeFar : softFlakeNear;
        this.r = randIn(T.r[0], T.r[1]);
        this.o = randIn(T.o[0], T.o[1]);
        this.vy = randIn(T.vy[0], T.vy[1]);
        this.mass = T.mass;
        this.rad = T.rad;
        this.x = Math.random() * (vw * 1.5) - vw * 0.25;
        /* 只在屏顶上方一小段生成：慢雪存活久，不把粒子池浪费在看不见的高空 */
        this.y = -12 - Math.random() * 48;
        /* 摆动：幅度 0.15–0.5 px/帧，正弦周期 3–7 秒，随机初相位 */
        this.sway = randIn(0.15, 0.5);
        this.omega = (Math.PI * 2) / randIn(3000, 7000);   /* rad / ms */
        this.ph = Math.random() * Math.PI * 2;
        /* 横向速度 lerp 平滑：初值就是目标值，不带起步瞬变 */
        this.speedX = wind.x * 0.12 + Math.sin(this.ph) * this.sway;
        this.dead = false;
        this.kind = 'snow';
    }
    step(dt, s) {
        /* 天气走了、空中的雪也化了：不再在太阳底下飘一分钟 */
        if (snowAir < 0.03 && W.snow < 0.5) { this.dead = true; return; }
        const dtf = dt / 16;
        const f = dtf * (0.6 + s * 0.5);
        this.ph += dt * this.omega;
        this.y += this.vy * f;
        /* 横向：全局风只乘 0.12 + 自己的慢摆，目标速度按 0.02/帧 lerp 趋近 */
        const target = wind.x * 0.12 + Math.sin(this.ph) * this.sway;
        this.speedX += (target - this.speedX) * 0.02 * dtf;
        this.x += this.speedX * dtf;

        /* 落到卡片顶积雪面上：沉积（指数核，边缘衰减，cap 22） */
        if (this.x > cardRect.left && this.x < cardRect.right) {
            const idx = ((this.x - cardRect.left) / SNOW_RES) | 0;
            const surf = cardRect.top - (snowField[idx] || 0);
            if (this.y >= surf && this.y < surf + this.vy * f + 4) {
                const cap = 22;
                for (let i = -this.rad; i <= this.rad; i++) {
                    const j = idx + i;
                    if (j >= 0 && j < snowField.length) {
                        /* 边缘衰减：雪堆边上薄 */
                        const edge = Math.min(j, snowField.length - 1 - j);
                        const eCap = cap * Math.min(1, edge / 12);
                        /* 指数沉积核：一片雪堆出圆丘不是柱子 */
                        if (snowField[j] < eCap)
                            snowField[j] += this.mass * SNOW_CARD_MASS * Math.exp(-Math.abs(i) / 2.2) * 0.85;
                    }
                }
                this.dead = true;
                return;
            }
        }
        /* B 的落点：最前层山脊——与冰雹共用 ridgeField，同一指数核，cap 22 */
        const ridx = (this.x / RIDGE_RES) | 0;
        const snowH = (ridx >= 0 && ridx < ridgeField.length) ? ridgeField[ridx] : 0;
        const ry = ridgeYAt(this.x) - snowH;
        if (this.y >= ry) {
            const cap = 22;
            for (let i = -this.rad; i <= this.rad; i++) {
                const j = ridx + i;
                if (j >= 0 && j < ridgeField.length && ridgeField[j] < cap)
                    ridgeField[j] += this.mass * Math.exp(-Math.abs(i) / 2.2) * 0.85;
            }
            this.dead = true;
            return;
        }
        if (this.y > vh + 40 || this.x > vw * 1.45 || this.x < -vw * 0.45) this.dead = true;
    }
    draw(g) {
        /* 近层轻微 alpha 呼吸（0.9–1.0 倍），远 / 中层恒定；不旋转、不描边 */
        const a = this.tier === 2 ? this.o * (0.95 + 0.05 * Math.sin(this.ph * 1.7)) : this.o;
        const d = this.r * 2.4;
        g.globalAlpha = a * snowAir;
        g.drawImage(this.sprite, this.x - d / 2, this.y - d / 2, d, d);
        g.globalAlpha = 1;
    }
}

/* ── 场景取样：B 没有照片，水珠的倒像与积水的折射从叠出场景的几张 canvas 上取 ──

   层序与透镜 ① 一致：astro → cloud → scene → fx → bolt。天空是 CSS 渐变不在 canvas 上，
   取到的透明处露出卡片玻璃本身。各层的视差已画进位图，屏幕坐标只需乘各 canvas 的 dpr。 */
const SCENE_SAMPLE_LAYERS = ['astro', 'cloud', 'scene', 'fx', 'bolt'];
/* 冰粒本身画在 fx 层上：它的折射取样不含 fx（canvas 画自己每次都整张快照拷贝，几十颗就掉帧） */

function drawSceneRegion(g, sx, sy, srx, sry, dx, dy, dw, dh, layers) {
    for (const k of (layers || SCENE_SAMPLE_LAYERS)) {
        const cv = cvs[k];
        const kx = cv.width / vw, ky = cv.height / vh;
        try {
            g.drawImage(cv, (sx - srx) * kx, (sy - sry) * ky, srx * 2 * kx, sry * 2 * ky, dx, dy, dw, dh);
        } catch (e) {}
    }
    return true;
}

/* ── 一颗水珠的画法（卡片与镜面共用）──
   ① 倒置的背景切片：水珠是小凸透镜，成一个缩小的倒像
   ② 暗边环：折射把边缘的光弯走——真实雨玻璃上珠子主要靠这圈暗边显形，不是白描边
   ③ 底缘亮弧：光从上方进、从下缘出（焦散）
   ④ 顶部一粒小高光
   sampler(g, r, asp) 在已翻转的局部坐标里画切片，返回 true 表示画上了 */
function paintDrop(g, x, y, r, asp, o, sampler) {
    g.save();
    g.translate(x, y);
    g.scale(1, asp);
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
    let sampled = false;
    if (sampler && r > 1.2) {
        g.save();
        g.scale(1, -1);
